name: Feature request
description: Propose a scoped ModeDOCK improvement
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe the workflow that is currently difficult or impossible.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Explain the smallest useful change and its expected CLI/TUI behavior.
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Safety scope
      options:
        - label: This request does not require arbitrary process injection, anti-cheat/DRM bypass, privilege escalation, or hidden file operations.
          required: true
