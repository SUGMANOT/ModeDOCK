name: Bug report
description: Report a reproducible ModeDOCK problem
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Do not attach private game files, paid mods, secrets, or personal logs without reviewing them first.
  - type: input
    id: version
    attributes:
      label: ModeDOCK version
      description: Run `moddock --version`.
      placeholder: 1.0.0b
    validations:
      required: true
  - type: dropdown
    id: interface
    attributes:
      label: Interface
      options:
        - Interactive TUI
        - Direct CLI command
        - Windows installer
        - Runtime compatibility command
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Include the exact command and a sanitized path if relevant.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
      description: Include the machine-readable error code when `--json` is available.
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Sanitized diagnostics
      description: Paste relevant `moddock doctor --json` output after removing private paths.
